[package]
name = "baia-host-connector"
version = "0.1.0"
description = "Baia Host Connector locale - protocollo v1"
authors = ["Baia"]
edition = "2021"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
ring = "0.17.14"
rustls = { version = "=0.23.43", default-features = false }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
