[package]
name = "baia-cinghiala"
version = "0.5.0"
description = "Client desktop Baia Cinghiala"
authors = ["Baia"]
edition = "2021"

[lib]
name = "baia_cinghiala_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
base64 = "0.22"
ed25519-dalek = "3.0.0"
getrandom = "0.4"
sha2 = "0.11"
zeroize = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
rustls = { version = "=0.23.43", default-features = false }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store"] }
