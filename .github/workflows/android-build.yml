name: Android build

# Costruisce l'APK di debug del client Android dal progetto committato in
# src-tauri/gen/android. Si lancia a mano: serve a verificare che le modifiche
# native (manifest, permessi, provider) continuino a compilare, dato che nessuna
# macchina di sviluppo del progetto ha SDK e NDK Android.
#
# Il progetto Android NON viene rigenerato: `tauri android init` sovrascriverebbe
# i file del template e quindi le personalizzazioni. Se in futuro serve rigenerarlo,
# va fatto consapevolmente e ricontrollando il diff del manifest.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verifica che il progetto Android sia nel repository
        run: test -f src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build debug APK (arm64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: npm run tauri android build -- --debug --apk --target aarch64

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
